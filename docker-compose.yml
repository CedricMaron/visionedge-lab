# InferenceLab — local orchestration.
# CPU-first by default. GPU is opt-in (uncomment the deploy block + use the cuda Dockerfile).
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: inferencelab-backend:cpu
    ports:
      - "8000:8000"
    environment:
      - IL_HOST=0.0.0.0
      - IL_PORT=8000
      - IL_LOG_JSON=true
      - IL_DEFAULT_MODEL_ID=yolov8n-onnx
      - IL_DEFAULT_VLM_ID=mock-vlm
    volumes:
      - ./models:/app/models:ro
      - ./benchmark-data:/app/benchmark-data
    # --- GPU (opt-in): requires nvidia-container-toolkit ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: inferencelab-frontend:latest
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
